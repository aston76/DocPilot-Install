name: Build and publish verified beta 18
on:
  push:
    branches: [main]
    paths: ['tools/beta18/**', 'Install-DocPilot.ps1', 'tools/build_beta18.py', '.github/workflows/publish-beta18.yml']
  pull_request:
    paths: ['tools/beta18/**', 'Install-DocPilot.ps1', 'tools/build_beta18.py', '.github/workflows/publish-beta18.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify native Windows control lookup
        run: |
          powershell.exe -STA -NoProfile -ExecutionPolicy Bypass -File tools/beta18/test_update_controls.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native control lookup failed' }
      - name: Verify progress survives a concurrent reader
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/beta18/test_progress_write.ps1
          if($LASTEXITCODE -ne 0){throw 'Progress replacement test failed'}
      - name: Verify startup scan, progress and cache isolation
        run: |
          python tools/beta18/test_hash_store.py
          if ($LASTEXITCODE -ne 0) { throw 'SQLite tests failed' }
          python tools/beta18/test_startup_sha.py
          if ($LASTEXITCODE -ne 0) { throw 'Scan tests failed' }
          python tools/beta18/test_fast_lookup.py
          if ($LASTEXITCODE -ne 0) { throw 'Lookup tests failed' }
          python tools/beta18/test_catalogue_sync.py
          if ($LASTEXITCODE -ne 0) { throw 'Catalogue synchronization tests failed' }
      - name: Verify scan progress display
        run: |
          node tools/beta18/test_update_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Updater display tests failed' }
          node tools/beta18/test_pc_inbox_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'PC inbox display tests failed' }
      - name: Verify scanner display
        run: |
          node tools/beta18/test_theme_ui.cjs
          if($LASTEXITCODE -ne 0){throw 'Theme tests failed'}
          node tools/beta18/test_scanner_ui.cjs
          if($LASTEXITCODE -ne 0){throw 'Scanner display failed'}
      - name: Build from checksum-verified public beta 12
        run: python tools/build_beta18.py
      - name: Parse installer scripts and verify update UI protocol
        shell: pwsh
        run: |
          foreach ($script in @('tools/beta18/DocPilot-Update.ps1','Install-DocPilot.ps1','tools/beta18/test_update_window.ps1')) {
            $tokens=$null;$errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw (($errors | ForEach-Object { $_.Message+' at line '+$_.Extent.StartLineNumber }) -join "`n")}
          }
          python -m pip install fastapi httpx pymupdf
          if($LASTEXITCODE -ne 0){throw 'Test dependencies unavailable'}
          python tools/beta18/test_pc_inbox.py
          if($LASTEXITCODE -ne 0){throw 'PC inbox tests failed'}
          python tools/beta18/test_scanner.py
          if($LASTEXITCODE -ne 0){throw 'Scanner tests failed'}
          python -c "import sys,pathlib;sys.path.insert(0,'tools/beta18');import docpilot_scanner;pathlib.Path('release-package/Scanner.ps1').write_text(docpilot_scanner._SCRIPT,encoding='utf-8-sig')"
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'release-package/Scanner.ps1'),[ref]$tokens,[ref]$errors)
          if($errors.Count){throw 'Scanner PowerShell syntax invalid'}
          python tools/beta18/test_update_api.py
          if($LASTEXITCODE -ne 0){throw 'Update protocol tests failed'}
      - name: Verify candidate starts and blocks work without an archive
        shell: pwsh
        run: |
          Expand-Archive release-package/DocPilot-Windows-portable.zip release-package/candidate
          $process = Start-Process (Resolve-Path release-package/candidate/DocPilot.exe) -WorkingDirectory (Resolve-Path release-package/candidate) -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8765/api/v1/health -TimeoutSec 2
                if ($health.status -eq 'ok') { $healthy = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) { throw 'Candidate failed to start' }
            $version = Invoke-RestMethod http://127.0.0.1:8765/api/v1/system/update -TimeoutSec 5
            if ($version.current -ne 'v0.1.0-beta.18') { throw 'Wrong executable version' }
            $inbox=Invoke-RestMethod http://127.0.0.1:8765/api/v1/pc-inbox -TimeoutSec 5
            if($inbox.running -or $inbox.total -ne 0){throw 'Discovery must be idle and empty on a new installation'}
            $scanner = Invoke-RestMethod http://127.0.0.1:8765/api/v1/scanner -TimeoutSec 5
            if(-not $scanner.supported -or $scanner.running -or $scanner.pages -ne 0){throw 'Scanner must be available and idle on Windows'}
            $scannerDevices = Invoke-RestMethod http://127.0.0.1:8765/api/v1/scanner/devices -TimeoutSec 30
            if(-not $scannerDevices.supported){throw 'Windows scanner bridge missing'}
            $workspace = Invoke-RestMethod http://127.0.0.1:8765/api/v1/workspace -TimeoutSec 5
            if ($workspace.ready) { throw 'Clean machine must not choose an unrelated archive' }
            try {
              Invoke-WebRequest http://127.0.0.1:8765/api/v1/documents/upload -Method Post -UseBasicParsing -TimeoutSec 5
              throw 'Upload was not blocked'
            } catch {
              if ([int]$_.Exception.Response.StatusCode -ne 423) { throw }
            }
            $page = (Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).Content
            if ($page -notmatch 'automatic-index-beta18') { throw 'Outdated frontend' }
            $nas = Join-Path $env:RUNNER_TEMP 'DocPilot-SHA\Example\Fournisseurs-Créanciers'
            New-Item -ItemType Directory -Path (Join-Path $nas 'Factures') -Force | Out-Null
            New-Item -ItemType Directory -Path (Join-Path $nas 'Contrats') -Force | Out-Null
            $file = Join-Path $nas 'Factures\test.pdf'
            [IO.File]::WriteAllBytes($file, [Text.Encoding]::ASCII.GetBytes('%PDF-SHA-test'))
            $expected = (Get-FileHash $file -Algorithm SHA256).Hash
            $body = @{root=$nas} | ConvertTo-Json -Compress
            $chosen = Invoke-RestMethod http://127.0.0.1:8765/api/v1/workspace/select -Method Post -ContentType 'application/json; charset=utf-8' -Body $body -TimeoutSec 40
            if (-not $chosen.ready) { throw 'Test archive not selected' }
            for ($i = 0; $i -lt 30; $i++) {
              $sha = Invoke-RestMethod http://127.0.0.1:8765/api/v1/archive/sha256 -TimeoutSec 5
              if ($sha.phase -eq 'complete') { break }
              Start-Sleep -Seconds 1
            }
            if ($sha.phase -ne 'complete' -or $sha.indexed_files -ne 1 -or $sha.percent -ne 100) { throw 'Automatic SHA scan failed after workspace verification' }
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $expected) { throw 'SHA scan changed an archive file' }
            $second = Join-Path $nas 'Factures\second.pdf'
            [IO.File]::WriteAllBytes($second,[Text.Encoding]::ASCII.GetBytes('%PDF-second'))
            $found=$false
            for($i=0;$i -lt 30;$i++){
              $sha=Invoke-RestMethod http://127.0.0.1:8765/api/v1/archive/sha256 -TimeoutSec 5
              if($sha.phase -eq 'complete' -and $sha.indexed_files -eq 2){$found=$true;break}
              Start-Sleep -Seconds 1
            }
            if(-not $found){throw 'Native change notification did not index the new file'}
            if(-not (Test-Path (Join-Path $nas 'DocPilot-Partage\v1'))){throw 'Shared index not published'}
            Stop-Process -Id $process.Id -Force
            $process = Start-Process (Resolve-Path release-package/candidate/DocPilot.exe) -WorkingDirectory (Resolve-Path release-package/candidate) -PassThru -WindowStyle Hidden
            $completed = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $sha = Invoke-RestMethod http://127.0.0.1:8765/api/v1/archive/sha256 -TimeoutSec 2
                if ($sha.phase -eq 'complete' -and $sha.indexed_files -eq 2) { $completed = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
            if (-not $completed) { throw 'SHA scan did not restart automatically on reopening' }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - name: Verify staged upgrade preserves data and private profile
        shell: pwsh
        run: |
          $data=Join-Path $env:LOCALAPPDATA 'DocPilot'
          New-Item -ItemType Directory -Path $data -Force | Out-Null
          $sentinel=Join-Path $data 'upgrade-sentinel.txt'
          'keep-private-data' | Set-Content $sentinel
          $installer=Resolve-Path release-package/candidate/Install-DocPilot.ps1
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer
          if($LASTEXITCODE -ne 0){throw 'First staged installation failed'}
          $target=Join-Path $env:LOCALAPPDATA 'Programs/DocPilot'
          'keep-profile' | Set-Content (Join-Path $target 'private-profile-sentinel.txt')
          Push-Location $target
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $installer
            if($LASTEXITCODE -ne 0){throw 'Repeated staged installation failed'}
          } finally {Pop-Location}
          if((Get-Content $sentinel).Trim() -ne 'keep-private-data'){throw 'User data changed'}
          if((Get-Content (Join-Path $target 'private-profile-sentinel.txt')).Trim() -ne 'keep-profile'){throw 'Private program profile lost'}
          if((Get-FileHash (Join-Path $target 'DocPilot.exe')).Hash -ne (Get-FileHash release-package/candidate/DocPilot.exe).Hash){throw 'Installed executable differs'}
          $leftovers=@(Get-ChildItem (Split-Path $target -Parent) -Directory | Where-Object {$_.Name -like 'DocPilot-stage-*' -or $_.Name -like 'DocPilot-backup-*'})
          if($leftovers.Count){throw 'Staging folders were not cleaned'}
          & tools/beta18/test_update_silent.ps1
          if($LASTEXITCODE -ne 0){throw 'Silent updater installation failed'}
          $result=Get-Content (Join-Path $data 'update-state.json') -Raw | ConvertFrom-Json
          if($result.status -ne 'complete' -or $result.percent -ne 100 -or $result.version -ne 'v0.1.0-beta.18'){throw 'Updater did not record completion'}
          if((Get-Content $sentinel).Trim() -ne 'keep-private-data'){throw 'Updater changed data'}
          if((Get-Content (Join-Path $target 'private-profile-sentinel.txt')).Trim() -ne 'keep-profile'){throw 'Updater lost profile'}
      - name: Verify direct upgrades from actual beta 12 and beta 14
        shell: pwsh
        run: |
          & tools/beta18/test_legacy_upgrade.ps1
          if($LASTEXITCODE -ne 0){throw 'Legacy compatibility failed'}
      - name: Keep Windows installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installation-diagnostics
          path: |
            ~/AppData/Local/DocPilot/installer-*.log
            ~/AppData/Local/DocPilot/native-*.log
            ~/AppData/Local/DocPilot/update-state.json
          if-no-files-found: ignore
      - name: Publish complete release atomically
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create v0.1.0-beta.18 release-package/DocPilot-Windows-portable.zip release-package/DocPilot-Windows-portable.zip.sha256 --draft --prerelease --title "DocPilot beta 18 - scanner, dark mode and legacy compatibility" --notes-file tools/beta18/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed' }
          gh release view v0.1.0-beta.18 --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw 'Asset verification failed' }
          gh release edit v0.1.0-beta.18 --draft=false --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
