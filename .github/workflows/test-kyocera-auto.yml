name: Test local scanner PDF import bridge
on:
  push:
    branches: [main]
    paths: ['tools/kyocera_auto/**', '.github/workflows/test-kyocera-auto.yml']
  pull_request:
    paths: ['tools/kyocera_auto/**', '.github/workflows/test-kyocera-auto.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r tools/kyocera_auto/requirements.txt
      - name: Verify import, duplicates, interruptions and local receipt
        run: python -m unittest discover -s tools/kyocera_auto -p test_bridge.py -v
