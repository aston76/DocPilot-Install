name: Test direct Windows installation

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  install:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download and install with public PowerShell script
        shell: pwsh
        run: ./install.ps1
      - name: Verify clean first launch
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\DocPilot\DocPilot.exe'
          if (-not (Test-Path $exe)) { throw 'DocPilot.exe absent après installation' }
          $process = Start-Process $exe -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              try {
                $result = Invoke-RestMethod http://127.0.0.1:8765/api/v1/health -TimeoutSec 2
                if ($result.status -eq 'ok') { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) { throw 'DocPilot ne démarre pas après installation' }
            $documents = (Invoke-WebRequest http://127.0.0.1:8765/api/v1/documents -UseBasicParsing).Content.Trim()
            $entities = (Invoke-WebRequest http://127.0.0.1:8765/api/v1/legal-entities -UseBasicParsing).Content.Trim()
            $creditors = (Invoke-WebRequest http://127.0.0.1:8765/api/v1/creditors -UseBasicParsing).Content.Trim()
            if ($documents -ne '[]' -or $entities -ne '[]' -or $creditors -ne '[]') {
              throw 'La nouvelle installation contient des données préchargées'
            }
            $index = Invoke-RestMethod http://127.0.0.1:8765/api/v1/archive/sha256
            if ($index.indexed_files -ne 0 -or $index.running) {
              throw 'La nouvelle installation contient un index privé ou un scan inattendu'
            }
            $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'DocPilot') { throw 'Interface inaccessible' }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - name: Verify update preserves data and closes the old app
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\DocPilot\DocPilot.exe'
          $process = Start-Process $exe -PassThru -WindowStyle Hidden
          try {
            for ($i = 0; $i -lt 60; $i++) {
              try { $health = Invoke-RestMethod http://127.0.0.1:8765/api/v1/health -TimeoutSec 2; break } catch { Start-Sleep -Seconds 1 }
            }
            $entity = Invoke-RestMethod http://127.0.0.1:8765/api/v1/legal-entities -Method Post -ContentType 'application/json' -Body '{"name":"Upgrade test entity","identifiers":[]}'
            ./install.ps1
            if (-not $process.HasExited) { throw 'Old app was not closed before updating' }
            $updated = Start-Process $exe -PassThru -WindowStyle Hidden
            try {
              $healthy = $false
              for ($i = 0; $i -lt 60; $i++) {
                try {
                  $health = Invoke-RestMethod http://127.0.0.1:8765/api/v1/health -TimeoutSec 2
                  if ($health.status -eq 'ok') { $healthy = $true; break }
                } catch {}
                Start-Sleep -Seconds 1
              }
              if (-not $healthy) { throw 'Updated app did not start' }
              $entities = Invoke-RestMethod http://127.0.0.1:8765/api/v1/legal-entities
              if (-not ($entities | Where-Object { $_.id -eq $entity.id -and $_.name -eq 'Upgrade test entity' })) { throw 'Update lost existing data' }
            } finally { Stop-Process -Id $updated.Id -Force -ErrorAction SilentlyContinue }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
